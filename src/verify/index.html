<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AREALME IQ Certification Verification Portal</title>
  <meta name="description" content="Official digital credentials and cognitive breakdown verification for the ARealMe Standardized IQ Test.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="AREALME IQ Credential Verification">
  <meta property="og:description" content="View verified IQ scores and 7-dimensional cognitive profile.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://www.arealme.com/iq/en/">
  <base href="/iq/cert/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Cormorant:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Archivo:wght@400..900&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://areal.me/static/libs/sharekitv6.iife.js" defer></script>
</head>
<body>
  <script>
    (function() {
      try {
        var stored = localStorage.getItem('arealme_theme');
        var theme = (stored === 'light' || stored === 'dark') ? stored : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    })();
  </script>
  <div id="app"></div>
  <script type="module" src="main.js"></script>
</body>
</html>
